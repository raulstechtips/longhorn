{{- if .Values.minioSecret.enabled }}
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: {{ .Values.minioSecret.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "longhorn-wrapper.labels" . | nindent 4 }}
spec:
  infisicalAuthRef:
    name: {{ required "infisical.authRef.name is required when minioSecret.enabled is true" .Values.infisical.authRef.name | quote }}
    namespace: {{ required "infisical.authRef.namespace is required when minioSecret.enabled is true" .Values.infisical.authRef.namespace | quote }}
  syncOptions:
    refreshInterval: {{ .Values.minioSecret.refreshInterval | quote }}
  sources:
    - projectSlug: {{ required "infisical.projectSlug is required when minioSecret.enabled is true" .Values.infisical.projectSlug | quote }}
      environmentSlug: {{ required "infisical.environmentSlug is required when minioSecret.enabled is true" .Values.infisical.environmentSlug | quote }}
      secretPath: {{ .Values.minioSecret.secretPath | quote }}
      recursive: {{ .Values.minioSecret.recursive }}
  targets:
    - name: {{ .Values.minioSecret.secretName }}
      namespace: {{ .Release.Namespace }}
      kind: Secret
      secretType: Opaque
      creationPolicy: Orphan
      metadata:
        labels: {}
        annotations: {}
      template:
        engineVersion: v1
        data:
          AWS_ACCESS_KEY_ID: {{ "{{ .AWS_ACCESS_KEY_ID.Value }}" | quote }}
          AWS_SECRET_ACCESS_KEY: {{ "{{ .AWS_SECRET_ACCESS_KEY.Value }}" | quote }}
          AWS_ENDPOINTS: {{ required "minioSecret.endpoint is required when minioSecret.enabled is true" .Values.minioSecret.endpoint | quote }}
{{- end }}
