{{- if .Values.ingressRoute.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: longhorn-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "longhorn-wrapper.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingressRoute.ingressClass | quote }}
spec:
  entryPoints:
    {{- toYaml .Values.ingressRoute.entryPoints | nindent 4 }}
  routes:
    - kind: Rule
      match: Host(`{{ required "ingressRoute.host is required when ingressRoute.enabled is true" .Values.ingressRoute.host }}`)
      {{- with .Values.ingressRoute.middlewares }}
      middlewares:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        # Fixed upstream Service name in Longhorn 1.8.2.
        - name: longhorn-frontend
          port: 80
  tls:
    secretName: {{ required "ingressRoute.tlsSecretName is required when ingressRoute.enabled is true" .Values.ingressRoute.tlsSecretName | quote }}
{{- end }}
