suite: Storage classes preserve immutable parameters
templates: [templates/storageclasses.yaml]
tests:
  - it: renders all four live classes
    asserts:
      - hasDocuments:
          count: 4
      - equal:
          path: provisioner
          value: driver.longhorn.io
      - equal:
          path: allowVolumeExpansion
          value: true
      - equal:
          path: volumeBindingMode
          value: Immediate
  - it: preserves the three replica Retain class
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: longhorn-default-storage-class
      - equal:
          path: parameters
          value: {numberOfReplicas: "3", staleReplicaTimeout: "1440", volumeExpansion: "true"}
      - equal:
          path: reclaimPolicy
          value: Retain
  - it: preserves strict local storage
    documentIndex: 1
    asserts:
      - equal:
          path: parameters
          value: {dataLocality: strict-local, numberOfReplicas: "1", staleReplicaTimeout: "1440", volumeExpansion: "true"}
      - equal:
          path: reclaimPolicy
          value: Retain
  - it: preserves the one replica Retain class
    documentIndex: 2
    asserts:
      - equal:
          path: parameters
          value: {numberOfReplicas: "1", staleReplicaTimeout: "1440", volumeExpansion: "true"}
      - equal:
          path: reclaimPolicy
          value: Retain
  - it: adopts the one replica Delete class
    documentIndex: 3
    asserts:
      - equal:
          path: metadata.name
          value: longhorn-storage-class-replicas-1-delete
      - equal:
          path: parameters
          value: {numberOfReplicas: "1", staleReplicaTimeout: "1440", volumeExpansion: "true"}
      - equal:
          path: reclaimPolicy
          value: Delete
  - it: allows storage classes to be disabled
    set:
      storageClasses: []
    asserts:
      - hasDocuments:
          count: 0
