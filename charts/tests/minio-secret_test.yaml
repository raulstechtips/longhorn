suite: MinIO secret sync
templates: [templates/minio-secret.yaml]
release:
  name: longhorn
  namespace: longhorn-system
tests:
  - it: is off by default
    asserts:
      - hasDocuments:
          count: 0
  - it: keeps the secret keys and orphan ownership
    values: [../ci/all-on-values.yaml]
    asserts:
      - isKind:
          of: InfisicalStaticSecret
      - equal:
          path: metadata.name
          value: minio-secret
      - equal:
          path: spec.sources[0]
          value: {projectSlug: fake-project, environmentSlug: fake-env, secretPath: /minio/users/longhorn, recursive: true}
      - equal:
          path: spec.syncOptions.refreshInterval
          value: 60s
      - equal:
          path: spec.targets[0]
          value:
            name: minio-secret
            namespace: longhorn-system
            kind: Secret
            secretType: Opaque
            creationPolicy: Orphan
            metadata: {labels: {}, annotations: {}}
            template:
              engineVersion: v1
              data:
                AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID.Value }}"
                AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY.Value }}"
                AWS_ENDPOINTS: https://s3.example.test
