suite: Required environment values and schema
templates: [templates/minio-secret.yaml, templates/ingressroute.yaml]
tests:
  - it: requires infisical.authRef.name when enabled
    template: templates/minio-secret.yaml
    values: [../ci/all-on-values.yaml]
    set:
      infisical.authRef.name: ""
    asserts:
      - failedTemplate:
          errorMessage: infisical.authRef.name is required when minioSecret.enabled is true
  - it: requires infisical.authRef.namespace when enabled
    template: templates/minio-secret.yaml
    values: [../ci/all-on-values.yaml]
    set:
      infisical.authRef.namespace: ""
    asserts:
      - failedTemplate:
          errorMessage: infisical.authRef.namespace is required when minioSecret.enabled is true
  - it: requires infisical.projectSlug when enabled
    template: templates/minio-secret.yaml
    values: [../ci/all-on-values.yaml]
    set:
      infisical.projectSlug: ""
    asserts:
      - failedTemplate:
          errorMessage: infisical.projectSlug is required when minioSecret.enabled is true
  - it: requires infisical.environmentSlug when enabled
    template: templates/minio-secret.yaml
    values: [../ci/all-on-values.yaml]
    set:
      infisical.environmentSlug: ""
    asserts:
      - failedTemplate:
          errorMessage: infisical.environmentSlug is required when minioSecret.enabled is true
  - it: requires minioSecret.endpoint when enabled
    template: templates/minio-secret.yaml
    values: [../ci/all-on-values.yaml]
    set:
      minioSecret.endpoint: ""
    asserts:
      - failedTemplate:
          errorMessage: minioSecret.endpoint is required when minioSecret.enabled is true
  - it: requires ingressRoute.host when enabled
    template: templates/ingressroute.yaml
    values: [../ci/all-on-values.yaml]
    set:
      ingressRoute.host: ""
    asserts:
      - failedTemplate:
          errorMessage: ingressRoute.host is required when ingressRoute.enabled is true
  - it: requires ingressRoute.tlsSecretName when enabled
    template: templates/ingressroute.yaml
    values: [../ci/all-on-values.yaml]
    set:
      ingressRoute.tlsSecretName: ""
    asserts:
      - failedTemplate:
          errorMessage: ingressRoute.tlsSecretName is required when ingressRoute.enabled is true
  - it: rejects unknown wrapper settings
    template: templates/minio-secret.yaml
    set:
      minioSecret.unknown: x
    asserts:
      - failedTemplate:
          errorMessage: |
            values don't meet the specifications of the schema(s) in the following chart(s):
            longhorn:
            - minioSecret: Additional property unknown is not allowed
  - it: rejects string booleans
    template: templates/minio-secret.yaml
    set:
      minioSecret.enabled: "true"
    asserts:
      - failedTemplate:
          errorMessage: |
            values don't meet the specifications of the schema(s) in the following chart(s):
            longhorn:
            - minioSecret.enabled: Invalid type. Expected: boolean, given: string
  - it: leaves upstream settings open
    template: templates/minio-secret.yaml
    set:
      longhorn.futureSetting: value
    asserts:
      - hasDocuments:
          count: 0
