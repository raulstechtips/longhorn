suite: Volume snapshot policy
templates: [templates/volumesnapshotclasses.yaml]
tests:
  - it: keeps the default snapshot class
    asserts:
      - equal:
          path: metadata.name
          value: longhorn-volume-snapshot-class
      - equal:
          path: metadata.annotations["snapshot.storage.kubernetes.io/is-default-class"]
          value: "true"
      - equal:
          path: driver
          value: driver.longhorn.io
      - equal:
          path: deletionPolicy
          value: Delete
  - it: allows snapshot classes to be disabled
    set:
      volumeSnapshotClasses: []
    asserts:
      - hasDocuments:
          count: 0
