suite: Backup target adoption
templates: [templates/backuptargets.yaml]
tests:
  - it: is off without environment values
    asserts:
      - hasDocuments:
          count: 0
  - it: uses the configured target and credential reference
    values: [../ci/all-on-values.yaml]
    asserts:
      - isAPIVersion:
          of: longhorn.io/v1beta2
      - equal:
          path: metadata.name
          value: default
      - equal:
          path: spec
          value: {backupTargetURL: "s3://fake-backup@us-east-1/", credentialSecret: minio-secret, pollInterval: 5m0s}
